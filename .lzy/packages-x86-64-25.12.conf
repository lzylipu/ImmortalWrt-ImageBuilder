# LZY x86-64 ImmortalWrt 25.12 插件选择表
#
# 用法：
# - 每行左边是要加入固件的包名，可写一个或多个包。
# - # 后面是用途说明；整行前面加 # 就是不编译进去。
# - 这里是 LZY 独立分支配置，不改悟空上游的 shell/apk-custom-packages.sh。
# - Docker 由 Actions 里的 include_docker 控制；IPsec/XFRM kmod 由 enable_ipsec_kmods 控制。
#
# ⚠️ 代理类插件互相可能冲突：OpenClash / PassWall / PassWall2 / SSR+ / Nikki / dae 通常只选一种。

# ===== LZY 常用/优先区 =====
luci-i18n-nlbwmon-zh-cn                         # 带宽流量统计，适合长期观察各设备流量
luci-i18n-ddns-go-zh-cn                         # DDNS-GO，域名动态解析
luci-i18n-wol-zh-cn luci-i18n-timewol-zh-cn     # 网络唤醒/WOL，配合远程开机
luci-i18n-smartdns-zh-cn                        # SmartDNS，本地 DNS 优化/分流备用
luci-i18n-upnp-zh-cn                            # UPnP/NAT-PMP，游戏/远程服务自动端口映射
#luci-app-openclash luci-compat kmod-tun kmod-inet-diag kmod-nft-tproxy bash curl ip-full unzip # OpenClash；启用会自动下载核心和 Geo 数据
#luci-i18n-adblock-zh-cn                        # OpenWrt 侧广告过滤；已有 AdGuard Home 时通常不需要
#luci-i18n-https-dns-proxy-zh-cn                # DoH 代理；已有 AdGuard/OpenClash 链路时谨慎启用

# ===== 远程访问 / 内网穿透 =====
