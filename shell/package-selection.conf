# any    luci-i18n-homeproxy-zh-cn           # HomeProxy (基于 sing-box 核心的代理插件)
any    luci-i18n-nikki-zh-cn               # Nikki 科学上网插件 (支持 Clash-Meta/Mihomo 协议)
# any    luci-i18n-quickstart-zh-cn          # iStore 极简首页与引导向导
