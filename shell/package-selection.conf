# custom luci-app-mosdns                     # MosDNS 高性能 DNS 分流/DoH/DoQ 优化解析
# custom luci-app-nekobox                    # NekoBox 代理工具 (支持多协议配置)
any    luci-app-openclash                  # OpenClash 科学上网 (支持 Mihomo/Clash 核心)
any    luci-app-partexp                    # 硬盘分区扩容插件 (一键扩容当前固件系统分区)
