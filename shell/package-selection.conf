# ==============================================================================
# 🛡️ LZY 固件第三方软件包汇总配置文件 (package-selection.conf)
# ==============================================================================
# 💡 规范说明:
# 1. 本文件为上游统一控制中心，所有自定义集成的第三方插件在此文件开启/关闭。
# 2. 每行格式: <kind> <token>
#    - kind: 必须是 "apk" (针对 25.12 架构) 或 "any"
#    - token: 对应的软件包名。
# 3. 这里的 token 必须在 shell/apk-custom-packages.sh 中有对应的声明行。
# 4. 后台 GHA 编译时，工作流会自动解析本文件，取消对应插件的注释并打包进固件。
# ==============================================================================

# ===== 🌐 核心代理与分流生态 (Proxy Ecosystem) =====
apk luci-app-openclash                # 🚀 OpenClash: 经典 Clash 客户端，支持 Meta 内核、规则分流及 TProxy 透明代理
apk luci-app-passwall2                # 🎛️ Passwall2: 现代代理客户端，支持 sing-box/xray 混合后端与多流分流
apk luci-app-ssr-plus                 # ⚡ SSR-Plus: 轻量影音加速插件，支持 xray 和 mihomo 内核，占用小且稳定
apk luci-i18n-homeproxy-zh-cn         # 🏠 HomeProxy: 官方 sing-box 后端客户端，与内核路由整合度高
apk luci-i18n-daed-zh-cn              # 🦆 daed: 基于 eBPF 的高性能透明代理客户端，超低 CPU 延迟

# ===== 🛡️ DNS 劫持与广告拦截 (DNS & Ad Blocking) =====
apk adguardhome                       # 🧹 AdGuard Home: 局域网 DNS 防污染、去广告及安全劫持中心
# apk luci-app-mosdns                 # 🌀 MosDNS: 高性能本地 DNS 转发与防污染分流解析器（可选）

# ===== 🔐 VPN 远程接入与异地组网 (VPN & Tunneling) =====
apk luci-app-ipsec-hwdsl2             # 🛡️ IPsec VPN (hwdsl2): LZY 自研 IKEv2/L2TP/XAuth 多用户可视化面板 (Docker 桥接版)
# apk luci-proto-wireguard            # 🕸️ WireGuard: 原生内核态轻量 VPN 客户端支持
# apk luci-app-tailscale-community    # 📡 Tailscale: 零配置局域网穿透与虚拟异地组网工具

# ===== 📁 文件共享与系统工具 (File Sharing & Utilities) =====
apk luci-app-lucky                    # 🍀 Lucky: 大吉端口转发、DDNS 动态域名、内网穿透及 WebDAV 多合一神器
# apk luci-app-unishare               # 📂 UniShare: 统一文件共享管理（支持 WebDAV、Samba4 挂载）
# apk luci-i18n-dufs-zh-cn            # 📁 Dufs: 轻量级静态文件服务器（支持 Web 上传/下载/搜索）

# ===== 📊 流量分析与监控监控 (Traffic & Diagnostics) =====
# apk luci-app-bandix                 # 📈 Bandix: 界面美观的实时网络物理端口流量与带宽监控面板

# ===== 🔋 系统底层与电源控制 (System Control) =====
# apk luci-app-timewol-zh-cn          # ⏰ TimeWOL: 定时网络唤醒 (Wake on LAN) 电脑设备
# apk luci-app-partexp                # 💾 PartExp: sirpdboy 磁盘分区一键无损扩容工具
