# ==========================================================================
#                   ImmortalWrt 固件插件自定义汇总配置文件 (package-selection.conf)
# ==========================================================================
# 格式规则:
#   <kind> <token>
#
# 参数说明:
#   - kind:  any (在25.12和24.10都生效), apk (仅25.12生效), custom (仅24.10生效)
#   - token: 选取的匹配包标识 (必须在上游 apk-custom-packages.sh / custom-packages.sh 中存在)
#
# 使用方法: 若要编译此插件，删除行首的注释字符 '#' 即可；如需排除，在行首添加 '#'。
# 特别注意: 悟空上游 apply-package-selection.sh 使用 head -n1 查找到首个匹配并启用该行，
#           本文件中的 token 均已进行了防冲突重命名处理，保证精准启用。
# ==========================================================================

# ========================================== #
#             ⭐ 自研 IPsec 特别说明 ⭐       #
# ========================================== #
# luci-app-ipsec-hwdsl2 (自研 IPSec VPN Docker 容器管理 WebUI)
# 该插件不在下方的 apk-custom-packages.sh 或 custom-packages.sh 文件中管理。
# 它是通过 lzylipu/immortalwrt-ipsec-kmods 的 rootfs 注入直接打入固件。
# ========================================== #

# ========================================== #
#               一、 常用核心插件            #
# ========================================== #
any    luci-i18n-ipsec-vpnd-zh-cn          # IPSec VPN 服务器 (StrongSwan 内置 IPSec 服务，双仓专属) (⭐ 物理 IPSec VPN 服务器对接插件)
apk    luci-app-ipsec-hwdsl2               # 自研 IPSec VPN Docker 容器管理 WebUI (⭐ 双仓 IPsec Docker 界面，apk专属启用)
apk    adguardhome                         # AdGuard Home DNS 广告过滤主程序和设置 (25.12 apk 格式)
# any    luci-app-quickfile                  # QuickFile 极速网页文件管理器 (sbwml 开发，秒传高并发)
# any    luci-app-clashoo                    # Clashoo 科学上网工具 (Kenzo 仓库插件)
# custom luci-app-easytier                   # EasyTier 简单易用的内网穿透组网工具
any    luci-app-passwall2                  # Passwall 2 科学上网 (支持 xray/sing-box 等多种后端)
any    luci-app-ssr-plus                   # ShadowsocksR Plus+ 科学上网
custom luci-app-adguardhome                # AdGuard Home 广告拦截控制台界面 (24.10 custom 格式)
custom luci-app-advancedplus               # 高级设置 Plus (系统配置、内核优化、Argon 主题自定义等)
# custom luci-app-lucky                      # Lucky 大吉 软路由公网神器 (端口转发/反向代理/WOL/DDNS/ACME)
