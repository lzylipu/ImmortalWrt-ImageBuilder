# Custom Package Selection
# 每行: <kind> <token>  ->  apply-package-selection.sh 在上游
# shell/apk-custom-packages.sh 里 grep 匹配 token，取消整段注释拉进来
# 注意: 不要写多个 token 共享一行；apply 只取第一个字段当 token。

# ===== DNS / Ad Blocking =====
apk luci-app-adguardhome              # 拉进 adguardhome + luci-app-adguardhome + luci-i18n-adguardhome-zh-cn

# ===== Proxy Ecosystem =====
apk luci-app-openclash                # 拉进 openclash + luci-compat + kmod-tun + kmod-inet-diag + kmod-nft-tproxy + bash + curl + ip-full + unzip
apk luci-app-passwall2                # 拉进 geoview + xray-core + sing-box + hysteria + kmod-nft-socket + kmod-nft-tproxy + luci-app-passwall2 + luci-i18n-passwall2-zh-cn
apk luci-app-ssr-plus                 # 拉进 kmod-nft-tproxy + kmod-nft-socket + xray-core + naiveproxy + luci-app-ssr-plus + luci-i18n-ssr-plus-zh-cn
apk luci-i18n-homeproxy-zh-cn         # homeproxy (sing-box 后端)
apk luci-i18n-daed-zh-cn              # daed (eBPF 透明代理)
