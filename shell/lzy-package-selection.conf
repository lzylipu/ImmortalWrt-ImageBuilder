# LZY 汇总插件选择文件
#
# 这个文件不是新包源，也不直接写 PACKAGES；它只对原作者上游文件做“选择/解注释引用”。
# 实际包组必须存在于：
#   - shell/apk-custom-packages.sh   （ImmortalWrt 25.12.x / apk）
#   - shell/custom-packages.sh       （ImmortalWrt 24.10.x / ipk）
#
# 格式：
#   apk    关键包名    # 只在 25.12.x 从 shell/apk-custom-packages.sh 查找并启用包含该关键包名的原作者行
#   custom 关键包名    # 只在 24.10.x 从 shell/custom-packages.sh 查找并启用包含该关键包名的原作者行
#   any    关键包名    # 当前版本对应的上游文件里有就启用，没有就跳过
#
# 注释/取消注释这一行即可控制是否编译。脚本会复制原作者那一整行 CUSTOM_PACKAGES 的包组，
# 不会凭空添加上游文件里不存在的包，避免“没包报错”。
# IPsec/XFRM kmod 不在这里：它是 LZY 独立 kmod 仓编译后通过 enable_ipsec_kmods 注入。

# ===== LZY 当前使用 / 优先体现 =====
apk    luci-i18n-nlbwmon-zh-cn             # 带宽流量统计；来自 apk-custom-packages.sh
apk    luci-i18n-ddns-go-zh-cn             # DDNS-GO；来自 apk-custom-packages.sh
apk    luci-i18n-wol-zh-cn                 # 网络唤醒；来自 apk-custom-packages.sh
apk    luci-i18n-timewol-zh-cn             # 定时网络唤醒；来自 apk-custom-packages.sh
apk    luci-i18n-smartdns-zh-cn            # SmartDNS；来自 apk-custom-packages.sh
apk    luci-i18n-upnp-zh-cn                # UPnP/NAT-PMP；来自 apk-custom-packages.sh
custom luci-i18n-nlbwmon-zh-cn             # 24.10 带宽流量统计；来自 custom-packages.sh
custom luci-i18n-ddns-go-zh-cn             # 24.10 DDNS-GO；来自 custom-packages.sh
custom luci-i18n-wol-zh-cn                 # 24.10 网络唤醒；来自 custom-packages.sh
custom luci-i18n-timewol-zh-cn             # 24.10 定时网络唤醒；来自 custom-packages.sh
custom luci-i18n-smartdns-zh-cn            # 24.10 SmartDNS；来自 custom-packages.sh
custom luci-i18n-upnp-zh-cn                # 24.10 UPnP/NAT-PMP；来自 custom-packages.sh

