name: Build x86-64

on:
  workflow_dispatch:
    inputs:
      firmware_version:
        description: "ImmortalWrt 版本，例如 25.12.0 / 24.10.6"
        required: true
        default: "25.12.0"
      rootfs_size_mb:
        description: "rootfs 分区大小(MB)"
        required: true
        default: "1024"
      custom_router_ip:
        description: "路由器管理地址，例如 192.168.100.1 / 10.10.0.1"
        required: true
        default: "192.168.100.1"
      enable_store:
        description: "集成 iStore/store 商店"
        required: false
        type: boolean
        default: false
      include_docker:
        description: "集成 Docker 管理插件"
        required: true
        default: "yes"
        type: choice
        options: ["yes", "no"]
      enable_ipsec_kmods:
        description: "25.12.x 集成 独立编译 of IPsec/XFRM kmod APK"
        required: true
        default: "yes"
        type: choice
        options: ["yes", "no"]
      ipsec_kmod_repo:
        description: "IPsec kmod 仓库 owner/repo"
        required: false
        default: "lzylipu/immortalwrt-ipsec-kmods"
      ipsec_kmod_release:
        description: "IPsec kmod Release tag；auto=按 firmware_version 自动匹配"
        required: false
        default: "auto"
      enable_pppoe:
        description: "是否配置 PPPoE"
        required: true
        default: "no"
        type: choice
        options: ["yes", "no"]
      deploy_target:
        description: "部署环境：物理机=squashfs(可恢复出厂)，虚拟机=ext4(Docker兼容)"
        required: true
        default: "vm"
        type: choice
        options:
          - "vm"
          - "physical"
      pppoe_account:
        description: "宽带账号（启用 PPPoE 时填写）"
        required: false
      pppoe_password:
        description: "宽带密码（启用 PPPoE 时填写）"
        required: false
#  push:
#    branches:
#      - ipsec-kmods
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Resolve build parameters
        id: params
        run: |
          version="${{ inputs.firmware_version }}"
          if [ -z "$version" ]; then
            version="25.12.0"
          fi
          case "$version" in
            25.12.*)
              echo "series=25" >> "$GITHUB_OUTPUT"
              echo "config=x86-64/imm25.config" >> "$GITHUB_OUTPUT"
              echo "script=x86-64/build25.sh" >> "$GITHUB_OUTPUT"
              echo "image=immortalwrt/imagebuilder:x86-64-openwrt-${version}" >> "$GITHUB_OUTPUT"
              echo "store_file=shell/apk-custom-packages.sh" >> "$GITHUB_OUTPUT"
              ;;
            24.10.*)
              echo "series=24" >> "$GITHUB_OUTPUT"
              echo "config=x86-64/imm.config" >> "$GITHUB_OUTPUT"
              echo "script=x86-64/build24.sh" >> "$GITHUB_OUTPUT"
              echo "image=immortalwrt/imagebuilder:x86-64-openwrt-${version}" >> "$GITHUB_OUTPUT"
              echo "store_file=shell/custom-packages.sh" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Only 24.10.x and 25.12.x x86-64 are supported by this LZY unified workflow" >&2
              exit 1
              ;;
          esac

      - name: Save Custom Router IP into OpenWrt files
        run: |
          mkdir -p "${{ github.workspace }}/custom"
          echo "${{ inputs.custom_router_ip || '192.168.100.1' }}" > "${{ github.workspace }}/custom/custom_router_ip.txt"
          echo "您设置的路由器管理地址是:${{ inputs.custom_router_ip }}"

      - name: Validate PPPoE Inputs
        run: |
          if [[ "${{ inputs.enable_pppoe }}" == "yes" ]]; then
            if [[ -z "${{ inputs.pppoe_account }}" || -z "${{ inputs.pppoe_password }}" ]]; then
              echo "Error: PPPoE account and password must be provided when PPPoE is enabled!"
              exit 1
            fi
          fi

      - name: Enable Store integration through upstream package file
        run: |
          if [ "${{ inputs.enable_store || 'false' }}" == "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-store"' >> "${{ steps.params.outputs.store_file }}"
            echo "✅ 已追加 luci-app-store 到 ${{ steps.params.outputs.store_file }}"
          else
            echo "❎ 未启用 luci-app-store"
          fi

      - name: Fetch IPsec kmod integration script from ipsec-kmods repo
        if: ${{ steps.params.outputs.series == '25' && (inputs.enable_ipsec_kmods || 'yes') == 'yes' }}
        run: |
          # 适配脚本托管在 lzylipu/immortalwrt-ipsec-kmods/scripts/ipsec-kmod-fetch.sh，
          # 所以此 fork 工作目录不再维护 IPsec 相关文件——一处改、IB 自动收到新版本。
          mkdir -p "${{ github.workspace }}/shell"
          curl -fsSL "https://raw.githubusercontent.com/${{ inputs.ipsec_kmod_repo || 'lzylipu/immortalwrt-ipsec-kmods' }}/main/scripts/ipsec-kmod-fetch.sh" \
            -o "${{ github.workspace }}/shell/ipsec-kmods.sh"
          chmod +x "${{ github.workspace }}/shell/ipsec-kmods.sh"
          echo "✅ fetched IPsec kmod integration script from ${{ inputs.ipsec_kmod_repo || 'lzylipu/immortalwrt-ipsec-kmods' }}"

      - name: Configure rootfs format (squashfs vs ext4)
        run: |
          CONFIG_FILE="${{ github.workspace }}/${{ steps.params.outputs.config }}"
          DEPLOY_TARGET="${{ inputs.deploy_target || 'vm' }}"
          echo "Deploy target: $DEPLOY_TARGET"
          if [ "$DEPLOY_TARGET" = "physical" ]; then
            # 物理机: squashfs (只读+overlay，可恢复出厂)
            sed -i 's/^CONFIG_USES_EXT4=y/CONFIG_USES_EXT4=n/' "$CONFIG_FILE"
            sed -i 's/^CONFIG_TARGET_ROOTFS_EXT4FS=y/CONFIG_TARGET_ROOTFS_EXT4FS=n/' "$CONFIG_FILE"
            sed -i 's/^# *CONFIG_USES_SQUASHFS is not set/CONFIG_USES_SQUASHFS=y/' "$CONFIG_FILE"
            sed -i 's/^# *CONFIG_TARGET_ROOTFS_SQUASHFS is not set/CONFIG_TARGET_ROOTFS_SQUASHFS=y/' "$CONFIG_FILE"
            echo "✅ 物理机模式: squashfs 格式 (可恢复出厂设置)"
          else
            # 虚拟机: ext4 (Docker overlay 兼容，无嵌套问题)
            sed -i 's/^CONFIG_USES_EXT4=n/CONFIG_USES_EXT4=y/' "$CONFIG_FILE"
            sed -i 's/^CONFIG_TARGET_ROOTFS_EXT4FS=n/CONFIG_TARGET_ROOTFS_EXT4FS=y/' "$CONFIG_FILE"
            echo "✅ 虚拟机模式: ext4 格式 (Docker 兼容)"
          fi
          echo "--- .config rootfs format settings ---"
          grep -E 'CONFIG_USES_EXT4|CONFIG_TARGET_ROOTFS_EXT4FS|CONFIG_USES_SQUASHFS|CONFIG_TARGET_ROOTFS_SQUASHFS' "$CONFIG_FILE"

      - name: Build x86-64 firmware
        run: |
          chmod +x "${{ github.workspace }}/${{ steps.params.outputs.script }}"
          docker run --rm -i \
            --user root \
            -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
            -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
            -v "${{ github.workspace }}/custom:/home/build/immortalwrt/files/etc/config" \
            -v "${{ github.workspace }}/${{ steps.params.outputs.config }}:/home/build/immortalwrt/.config" \
            -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
            -v "${{ github.workspace }}/${{ steps.params.outputs.script }}:/home/build/immortalwrt/build.sh" \
            -e PROFILE="${{ inputs.rootfs_size_mb || '1024' }}" \
            -e INCLUDE_DOCKER="${{ inputs.include_docker || 'yes' }}" \
            -e IMMORTALWRT_VERSION="${{ inputs.firmware_version || '25.12.0' }}" \
            -e ENABLE_IPSEC_KMODS="${{ inputs.enable_ipsec_kmods || 'yes' }}" \
            -e IPSEC_KMOD_REPO="${{ inputs.ipsec_kmod_repo || 'lzylipu/immortalwrt-ipsec-kmods' }}" \
            -e IPSEC_KMOD_RELEASE="${{ inputs.ipsec_kmod_release || 'auto' }}" \
            -e ENABLE_PPPOE="${{ inputs.enable_pppoe || 'no' }}" \
            -e PPPOE_ACCOUNT="${{ inputs.pppoe_account || '' }}" \
            -e PPPOE_PASSWORD="${{ inputs.pppoe_password || '' }}" \
            "${{ steps.params.outputs.image }}" /bin/bash /home/build/immortalwrt/build.sh

      - name: Create info
        run: |
          cat > "${{ github.workspace }}/router-info.md" <<EOF
          ## 📡 Custom x86-64 固件信息

          - 版本: ${{ inputs.firmware_version }}
          - 后台地址: ${{ inputs.custom_router_ip }}
          - 用户名: root
          - 密码: 无
          - Docker: ${{ inputs.include_docker }}
          - IPsec kmods: ${{ inputs.enable_ipsec_kmods }}
          - 部署环境: ${{ inputs.deploy_target == 'physical' && '物理机(squashfs)' || '虚拟机(ext4)' }}
          - 插件选择文件: shell/package-selection.conf（引用上游 shell/custom-packages.sh 或 shell/apk-custom-packages.sh）
          EOF

      - name: Upload LZY firmware as release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Autobuild-x86-64
          name: Autobuild-x86-64
          body_path: ${{ github.workspace }}/router-info.md
          files: |
            ${{ github.workspace }}/bin/targets/x86/64/*${{ inputs.deploy_target == 'physical' && 'squashfs' || 'ext4' }}-combined-efi.img.gz
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
