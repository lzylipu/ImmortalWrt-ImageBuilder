name: Sync upstream master

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ipsec-kmods

      - name: Sync upstream into LZY branch
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/wukongdaily/ImmortalWrt-ImageBuilder.git || true
          git fetch upstream master
          git fetch origin ipsec-kmods

          # 不再 push origin/master —— github-actions[bot] 默认 GITHUB_TOKEN 没有
          # workflows 权限，无法 push 涉及 .github/workflows/*.yml 的改动，会持续
          # surface 红叉（remote rejected）。需要对照悟空原版直接看 upstream/master:
          # git diff upstream/master -- <path>

          # 把上游更新合入 LZY 分支。先用 -X ours 让 git 自动解 content 冲突；
          # 剩下的 modify/delete 冲突（我们改名为 .disabled、上游改了原文件内容）
          # -X ours 不会自动处理，靠下面这段兜底：一律按"我们的删除决定"为准。
          PRE_MERGE_SHA=$(git rev-parse origin/ipsec-kmods)
          git checkout -B ipsec-kmods origin/ipsec-kmods

          if git merge --no-edit -X ours upstream/master; then
            MERGED_CLEAN=1
          else
            MERGED_CLEAN=0
          fi

          if [ "$MERGED_CLEAN" = "0" ]; then
            # 兜底解决所有 unmerged 路径。git status 里的标记含义：
            #   DU = deleted by us, modified by them   → 我们删了，上游改了 → rm
            #   UD = modified by us, deleted by them   → 我们改了，上游删了 → add (保留我们的)
            #   UU/AA/UA = content conflict 双方都改 → -X ours 已选 ours 但仍可能 staged，
            #                                        用 checkout --ours 兜底
            # 逐行从 git status --porcelain 拿状态码和路径
            while IFS= read -r line; do
              xy=$(printf "%s" "$line" | cut -c1-2)
              # 第 4 列起是 path（可能有引号，但 workflow 路径无空格，直接取）
              path=$(printf "%s" "$line" | cut -c4-)
              case "$xy" in
                DU)
                  # 我们删了上游改了 → 维持删除
                  git rm -f -- "$path" >/dev/null 2>&1 || true
                  ;;
                UD)
                  # 我们改了上游删了 → 保留我们的
                  git add -- "$path" >/dev/null 2>&1 || git checkout HEAD -- "$path" >/dev/null 2>&1 || true
                  ;;
                UU|AA|UA|AU|DD)
                  # content 冲突兜底：取 ours
                  git checkout --ours -- "$path" >/dev/null 2>&1 && git add -- "$path" >/dev/null 2>&1 || true
                  ;;
                *)
                  # 其他状态不动（可能已 staged）
                  ;;
              esac
            done < <(git status --porcelain | grep -E '^(DU|UD|UU|AA|AU|UA|DD) ')

            # 兜底完再扫一次，还有 unmerged 就真没招了
            REMAIN=$(git diff --name-only --diff-filter=U)
            if [ -n "$REMAIN" ]; then
              echo "❌ unresolved conflicts remain after auto-resolve:"
              echo "$REMAIN"
              git status --short
              exit 1
            fi

            # 完成这次 merge commit
            git commit --no-edit >/dev/null
          fi

          # ⚠️ 关键修正 v2：跟 merge 前的 PRE_MERGE_SHA 比，而不是跟 HEAD 比。
          # HEAD 已经是 merge 后的状态，git diff HEAD -- 会爆空。
          # GitHub 铁律：GITHUB_TOKEN 永远拿不到 workflows 权限，push 的 commit 里
          # 不能含 .github/workflows/ 下的文件改动，否则 remote rejected。
          # 解法：把 .github/workflows/ 还原成 merge 前 PRE_MERGE_SHA 的版本，再 amend。
          # 代价：上游对 .github/workflows/*.yml.disabled 的更新不同步到 fork
          # （但这些 workflow 本来就被 fork 禁用，无影响）。
          WORKFLOW_CHANGES=$(git diff --name-only "$PRE_MERGE_SHA" HEAD -- .github/workflows/ 2>/dev/null || true)
          if [ -n "$WORKFLOW_CHANGES" ]; then
            echo "ℹ️ stripping workflow-only changes from merge commit:"
            echo "$WORKFLOW_CHANGES"
            git checkout "$PRE_MERGE_SHA" -- .github/workflows/
            git add .github/workflows/
            git commit --amend --no-edit >/dev/null
            echo "✅ workflow changes stripped, push should now succeed."
          fi

          # 只有真有新提交要 push 时才 push，避免无意义的空 run 报错
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/ipsec-kmods)" ]; then
            git push origin ipsec-kmods
            echo "✅ upstream merged into ipsec-kmods and pushed."
          else
            echo "ℹ️ upstream already merged, nothing to push."
          fi
