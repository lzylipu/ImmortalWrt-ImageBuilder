name: Sync upstream master

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ipsec-kmods

      - name: Sync upstream into LZY branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/wukongdaily/ImmortalWrt-ImageBuilder.git || true
          git fetch upstream master
          git fetch origin ipsec-kmods

          # 本地分支随时可对照悟空原版：git diff upstream/master -- <path>
          # 不再 push origin/master —— github-actions[bot] 默认 GITHUB_TOKEN 没有
          # workflows 权限，无法 push 涉及 .github/workflows/*.yml 的改动，会
          # 一直 surface 红叉（remote rejected）。fork 的 master 分支已 stale
          # 也无所谓，需要对照时直接看 upstream/master 即可。

          # 把上游更新合入 LZY 分支；冲突时优先保留本分支自定义（如 .disabled
          # 改名、自己的 build-x86-64.yml 等），不让同步覆盖自定义。
          git checkout -B ipsec-kmods origin/ipsec-kmods
          if git merge --no-edit -X ours upstream/master; then
            # 只有真有新提交要 push 时才 push，避免无意义的空 run 报错
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/ipsec-kmods)" ]; then
              git push origin ipsec-kmods
              echo "✅ upstream merged into ipsec-kmods and pushed."
            else
              echo "ℹ️ upstream already merged, nothing to push."
            fi
          else
            echo "❌ upstream merge conflicted. Custom files were not overwritten; please resolve manually."
            git status --short
            exit 1
          fi
