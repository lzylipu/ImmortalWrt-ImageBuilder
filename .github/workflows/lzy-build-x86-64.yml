name: LZY Build x86-64

on:
  workflow_dispatch:
    inputs:
      firmware_version:
        description: "ImmortalWrt 版本，例如 25.12.0 / 24.10.6"
        required: true
        default: "25.12.0"
      rootfs_size_mb:
        description: "rootfs 分区大小(MB)"
        required: true
        default: "1024"
      custom_router_ip:
        description: "路由器管理地址，例如 192.168.100.1 / 10.10.0.1"
        required: true
        default: "192.168.100.1"
      enable_store:
        description: "集成 iStore/store 商店"
        required: false
        type: boolean
        default: false
      include_docker:
        description: "集成 Docker 管理插件"
        required: true
        default: "yes"
        type: choice
        options: ["yes", "no"]
      enable_ipsec_kmods:
        description: "25.12.x 集成 LZY 独立编译的 IPsec/XFRM kmod APK"
        required: true
        default: "yes"
        type: choice
        options: ["yes", "no"]
      ipsec_kmod_repo:
        description: "IPsec kmod 仓库 owner/repo"
        required: false
        default: "lzylipu/immortalwrt-ipsec-kmods"
      ipsec_kmod_release:
        description: "IPsec kmod Release tag；auto=按 firmware_version 自动匹配"
        required: false
        default: "auto"
      enable_pppoe:
        description: "是否配置 PPPoE"
        required: true
        default: "no"
        type: choice
        options: ["yes", "no"]
      pppoe_account:
        description: "宽带账号（启用 PPPoE 时填写）"
        required: false
      pppoe_password:
        description: "宽带密码（启用 PPPoE 时填写）"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Resolve build parameters
        id: params
        run: |
          version="${{ inputs.firmware_version }}"
          case "$version" in
            25.12.*)
              echo "series=25" >> "$GITHUB_OUTPUT"
              echo "config=x86-64/imm25.config" >> "$GITHUB_OUTPUT"
              echo "script=x86-64/build25.sh" >> "$GITHUB_OUTPUT"
              echo "image=immortalwrt/imagebuilder:x86-64-openwrt-${version}" >> "$GITHUB_OUTPUT"
              echo "store_file=shell/apk-custom-packages.sh" >> "$GITHUB_OUTPUT"
              ;;
            24.10.*)
              echo "series=24" >> "$GITHUB_OUTPUT"
              echo "config=x86-64/imm.config" >> "$GITHUB_OUTPUT"
              echo "script=x86-64/build24.sh" >> "$GITHUB_OUTPUT"
              echo "image=immortalwrt/imagebuilder:x86-64-openwrt-${version}" >> "$GITHUB_OUTPUT"
              echo "store_file=shell/custom-packages.sh" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Only 24.10.x and 25.12.x x86-64 are supported by this LZY unified workflow" >&2
              exit 1
              ;;
          esac

      - name: Save Custom Router IP into OpenWrt files
        run: |
          mkdir -p "${{ github.workspace }}/custom"
          echo "${{ inputs.custom_router_ip }}" > "${{ github.workspace }}/custom/custom_router_ip.txt"
          echo "您设置的路由器管理地址是:${{ inputs.custom_router_ip }}"

      - name: Validate PPPoE Inputs
        run: |
          if [[ "${{ inputs.enable_pppoe }}" == "yes" ]]; then
            if [[ -z "${{ inputs.pppoe_account }}" || -z "${{ inputs.pppoe_password }}" ]]; then
              echo "Error: PPPoE account and password must be provided when PPPoE is enabled!"
              exit 1
            fi
          fi

      - name: Enable Store integration through upstream package file
        run: |
          if [ "${{ inputs.enable_store }}" == "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-store"' >> "${{ steps.params.outputs.store_file }}"
            echo "✅ 已追加 luci-app-store 到 ${{ steps.params.outputs.store_file }}"
          else
            echo "❎ 未启用 luci-app-store"
          fi

      - name: Build LZY x86-64 firmware
        run: |
          chmod +x "${{ github.workspace }}/${{ steps.params.outputs.script }}"
          docker run --rm -i \
            --user root \
            -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
            -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
            -v "${{ github.workspace }}/custom:/home/build/immortalwrt/files/etc/config" \
            -v "${{ github.workspace }}/${{ steps.params.outputs.config }}:/home/build/immortalwrt/.config" \
            -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
            -v "${{ github.workspace }}/${{ steps.params.outputs.script }}:/home/build/immortalwrt/build.sh" \
            -e PROFILE=${{ inputs.rootfs_size_mb }} \
            -e INCLUDE_DOCKER=${{ inputs.include_docker }} \
            -e IMMORTALWRT_VERSION=${{ inputs.firmware_version }} \
            -e ENABLE_IPSEC_KMODS=${{ inputs.enable_ipsec_kmods }} \
            -e IPSEC_KMOD_REPO=${{ inputs.ipsec_kmod_repo }} \
            -e IPSEC_KMOD_RELEASE=${{ inputs.ipsec_kmod_release }} \
            -e ENABLE_PPPOE=${{ inputs.enable_pppoe }} \
            -e PPPOE_ACCOUNT=${{ inputs.pppoe_account }} \
            -e PPPOE_PASSWORD=${{ inputs.pppoe_password }} \
            "${{ steps.params.outputs.image }}" /bin/bash /home/build/immortalwrt/build.sh

      - name: Create info
        run: |
          cat > "${{ github.workspace }}/router-info.md" <<EOF
          ## 📡 LZY x86-64 固件信息

          - 版本: ${{ inputs.firmware_version }}
          - 后台地址: ${{ inputs.custom_router_ip }}
          - 用户名: root
          - 密码: 无
          - Docker: ${{ inputs.include_docker }}
          - IPsec kmods: ${{ inputs.enable_ipsec_kmods }}
          - 插件选择文件: shell/lzy-package-selection.conf（引用上游 shell/custom-packages.sh 或 shell/apk-custom-packages.sh）
          EOF

      - name: Upload LZY firmware as release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: LZY-Autobuild-x86-64
          name: LZY-Autobuild-x86-64
          body_path: ${{ github.workspace }}/router-info.md
          files: |
            ${{ github.workspace }}/bin/targets/x86/64/*squashfs-combined-efi.img.gz
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
